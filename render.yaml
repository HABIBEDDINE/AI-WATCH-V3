services:
  - type: web
    name: ai-watch-v3
    runtime: python
    region: frankfurt  # closest to Europe
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # ── Supabase (REQUIRED — server will crash without these) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ── AI / News API keys ──
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY_BACKUP
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      # ── Set this after deploying the frontend on Vercel ──
      - key: FRONTEND_URL
        sync: false
